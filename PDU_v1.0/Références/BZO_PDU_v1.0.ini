   inLevel8          = bits,   U08,  0, [7:7], "Masse", "+12V"
   inLevel9          = bits,   U08,  1, [0:0], "Masse", "+12V"
   inLevel10         = bits,   U08,  1, [1:1], "Masse", "+12V"
   inLevel11         = bits,   U08,  1, [2:2], "Masse", "+12V"
   inLevel12         = bits,   U08,  1, [3:3], "Masse", "+12V"
   inLevel13         = bits,   U08,  1, [4:4], "Masse", "+12V"
   inLevel14         = bits,   U08,  1, [5:5], "Masse", "+12V"
   inLevel15         = bits,   U08,  1, [6:6], "Masse", "+12V"
   inLevel16         = bits,   U08,  1, [7:7], "Masse", "+12V"

   ; --- CAN ---
   CANspeed          = bits,   U08,  2, [0:2], "Desactive", "125 kbit/s", "250 kbit/s", "500 kbit/s", "1 Mbit/s", "INVALID", "INVALID", "INVALID"
   CANMode           = bits,   U08,  3, [0:2], "Demande/Reponse", "Broadcast", "INVALID", "INVALID", "INVALID", "INVALID", "INVALID", "INVALID"
   CANTimeout        = scalar, U08,  4, "s",    1.0,   0.0,   0.0,  255.0, 0
   CANOutMode        = bits,   U08,  5, [0:0], "Demande/Reponse", "Broadcast"
   CANTxRate         = scalar, U08,  6, "Hz",   1.0,   0.0,   0.0,  100.0, 0

   ; --- Fusibles (en A, 0 = desactive) ---
   fuse1             = scalar, U08,  7, "A",    1.0,   0.0,   0.0,  10.0, 0
   fuse2             = scalar, U08,  8, "A",    1.0,   0.0,   0.0,  10.0, 0
