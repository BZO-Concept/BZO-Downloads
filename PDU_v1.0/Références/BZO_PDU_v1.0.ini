;-------------------------------------------------------------------------------
; BZO PDU v1.0 - fichier .ini TunerStudio
; Va avec le firmware Code_PDU_v1.0 et BZO_TS.h
;
; REGLE D'OR : chaque offset et chaque taille ici doivent correspondre octet par
; octet aux structures du firmware (globals.h) :
;   - page 1  = struct config1  (configPage1, 25 octets)
;   - page 2  = struct config2  (configPage2, 104 octets)
;   - [OutputChannels] = getTSLogEntry() de globals.h (TS_LOG_TAILLE = 99)
;   - signature = TS_SIGNATURE du .ino, au caractere pres
; Toute modification d'une structure doit etre reportee ici (et inversement).
;
; Types : U08 / S08 / U16 / S16 (U = non signe, S = signe)
; Mise a l'echelle : valeur affichee = (valeur brute + translate) * scale
;
; Protocole : le firmware est compile avec TS_PROTOCOLE_CRC (protocole CRC).
;-------------------------------------------------------------------------------

[MegaTune]
   MTversion      = 2.25
   queryCommand   = "Q"
   signature      = "BZO GPIO PDU v1.0"
   versionInfo    = "S"

[TunerStudio]
   iniSpecVersion = 3.73

;-------------------------------------------------------------------------------

[SettingGroups]
   ; remplace le reglage "Temperature Display" de TS : Celsius en premier = choix par defaut
   ; (comme Speeduino : canaux en "°C", jauges en "TEMP", TS affiche selon ce choix)
   settingGroup  = temperatureDisplay, "Temperature"
   settingOption = CELSIUS,    "Celsius"
   settingOption = FAHRENHEIT, "Fahrenheit"

   ; MSDroid ne gere pas le protocole CRC : a activer uniquement dans le projet MSDroid (Android)
   settingGroup  = MSDROID_GROUP, "Compatibilite MSDroid (Android uniquement)"
   settingOption = DEFAULT,        "Desactivee"
   settingOption = MSDROID_COMPAT, "Activee"

;-------------------------------------------------------------------------------

[PcVariables]
   ; Numero CAN de la carte pour TS (0 par defaut), utilise via $tsCanId
   tsCanId          = bits,     U08,   [0:3], "CAN ID 0", "CAN ID 1", "CAN ID 2", "CAN ID 3", "CAN ID 4", "CAN ID 5", "CAN ID 6", "CAN ID 7", "CAN ID 8", "CAN ID 9", "CAN ID 10","CAN ID 11","CAN ID 12","CAN ID 13","CAN ID 14","INVALID"

;-------------------------------------------------------------------------------

[Constants]
   endianness          = little
   nPages              = 2
   pageSize            = 25, 104

   pageIdentifier      = "\$tsCanId\x01", "\$tsCanId\x02"
   pageReadCommand     = "p%2i%2o%2c",   "p%2i%2o%2c"
   pageValueWrite      = "M%2i%2o%2c%v", "M%2i%2o%2c%v"
   pageChunkWrite      = "M%2i%2o%2c%v", "M%2i%2o%2c%v"
   crc32CheckCommand   = "d%2i",         "d%2i"
   burnCommand         = "b%2i",         "b%2i"

   blockingFactor      = 64
   tableBlockingFactor = 64
   delayAfterPortOpen  = 1000
   blockReadTimeout    = 2000
   tsWriteBlocks       = on
   interWriteDelay     = 10
   pageActivationDelay = 10

#if MSDROID_COMPAT
   ; protocole leger (sans CRC) pour MSDroid
#else
   messageEnvelopeFormat = msEnvelope_1.0
#endif

;-------------------------------------------------------------------------------
; Page 1 : reglages generaux (configPage1, 25 octets) - globals.h, struct config1
;   name = scalar, type, offset, "unites", scale, translate, lo, hi, decimales
;   name = bits,   type, offset, [bit debut:bit fin], "choix 0", "choix 1"...
;-------------------------------------------------------------------------------
page = 1
   ; --- Entrees : niveau actif de chaque entree (DigitalLevel1 = entrees 1-8, DigitalLevel2 = 9-16) ---
   inLevel1          = bits,   U08,  0, [0:0], "Masse", "+12V"
   inLevel2          = bits,   U08,  0, [1:1], "Masse", "+12V"
