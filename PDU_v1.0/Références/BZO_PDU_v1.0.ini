      panel = fusiblesVoies

   ; ---------- CAN ----------
   dialog = canDialog, "CANBUS"
      field = "Vitesse", CANspeed
      field = "Trames d'entree",     CANMode,    { CANspeed > 0 }
      field = "Trames de sortie",    CANOutMode, { CANspeed > 0 }
      field = "Timeout securite", CANTimeout, { CANspeed > 0 }
      field = "Frequence broadcast", CANTxRate,  { CANspeed > 0 && CANOutMode == 1 }

   ; ---------- Sorties : un panneau par voie ----------
   dialog = voie1, "Voie 1"
      field = "Mode",                outMode1
      field = "Source",              outSource1,  { outMode1 >= 2 }
      field = "Sens",               outInv1,     { outMode1 >= 2 }
      field = "Tempo",  outTimeout1, { outMode1 >= 2 }
      field = "Frequence",       outPwmPeriod1, { outMode1 == 4 || outMode1 == 5 }
      field = "Duty",    outPwmDuty1, { outMode1 == 4 || outMode1 == 5 }
   dialog = voie2, "Voie 2"
      field = "Mode",                outMode2
      field = "Source",              outSource2,  { outMode2 >= 2 }
      field = "Sens",               outInv2,     { outMode2 >= 2 }
      field = "Tempo",  outTimeout2, { outMode2 >= 2 }
      field = "Frequence",       outPwmPeriod2, { outMode2 == 4 || outMode2 == 5 }
      field = "Duty",    outPwmDuty2, { outMode2 == 4 || outMode2 == 5 }
   dialog = voie3, "Voie 3"
      field = "Mode",                outMode3
      field = "Source",              outSource3,  { outMode3 >= 2 }
