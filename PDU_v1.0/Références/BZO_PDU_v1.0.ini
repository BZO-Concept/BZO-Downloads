   fuse9             = scalar, U08, 15, "A",    1.0,   0.0,   0.0,  10.0, 0
   fuse10            = scalar, U08, 16, "A",    1.0,   0.0,   0.0,  10.0, 0
   fuse11            = scalar, U08, 17, "A",    1.0,   0.0,   0.0,  10.0, 0
   fuse12            = scalar, U08, 18, "A",    1.0,   0.0,   0.0,  10.0, 0
   fuse13            = scalar, U08, 19, "A",    1.0,   0.0,   0.0,  50.0, 0
   fuse14            = scalar, U08, 20, "A",    1.0,   0.0,   0.0,  50.0, 0
